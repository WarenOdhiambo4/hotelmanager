<!doctype html>
<html lang="en" data-theme="berry">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Campus Food · Hotel prices, M-Pesa checkout, delivered to your block</title>
    <meta name="description" content="Every verified campus hotel on one live menu. Hotel prices, one flat service fee, M-Pesa straight to the hotel." />
    <meta name="theme-color" content="#d7263d" />
    <link rel="icon" type="image/svg+xml" href="/brand/campus-food-mark.svg" />
    <link rel="apple-touch-icon" href="/brand/campus-food-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Itim&family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before the first paint (no flash).
      try {
        var t = localStorage.getItem('campusFoodTheme')
        if (t) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
